<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="__APP_TAGLINE__" />
    <meta name="theme-color" content="#fff9f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1827" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__APP_NAME__" />
    <meta property="og:title" content="__APP_NAME__" />
    <meta property="og:description" content="__APP_TAGLINE__" />
    <meta name="twitter:card" content="summary" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="__APP_NAME__" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>__APP_NAME__</title>
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var d = JSON.parse(localStorage.getItem('__STORAGE_KEY__') || '{}');
        var s = d.settings || {};
        var dark = s.themeMode === 'dark' || (s.themeMode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.dataset.palette = s.palette || 'peach';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
